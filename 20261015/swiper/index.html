<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Swiper demo</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1"
    />
    <!-- Link Swiper's CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.css"
    />

    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.js"></script>

    <!-- Demo styles -->
    <style>
      html,
      body {
        position: relative;
        height: 100%;
      }

      body {
        background: #000;
        font-family:
          Helvetica Neue,
          Helvetica,
          Arial,
          sans-serif;
        font-size: 14px;
        color: #fff;
        margin: 0;
        padding: 0;
      }

      .swiper {
        width: 100%;
        height: 100%;
      }

      .swiper-slide {
        text-align: center;
        font-size: 18px;
        background: #444;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .swiper-slide img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
    </style>
  </head>

  <body>
    <!-- Swiper -->
    <div class="swiper visualSwiper">
      <div class="swiper-wrapper">
        <div class="swiper-slide">Slide 1</div>
        <div class="swiper-slide" style="background-color: aqua">Slide 2</div>
        <div class="swiper-slide" style="background-color: rgb(219, 216, 32)">Slide 3</div>
        <div class="swiper-slide">Slide 4</div>
        <div class="swiper-slide" style="background-color: rgb(219, 216, 32)">Slide 5</div>
        <div class="swiper-slide">Slide 6</div>
        <div class="swiper-slide" style="background-color: rgb(219, 216, 32)">Slide 7</div>
        <div class="swiper-slide">Slide 8</div>
        <div class="swiper-slide">Slide 9</div>
      </div>
      <div class="swiper-button-next"></div>
      <div class="swiper-button-prev"></div>
      <div class="swiper-pagination"></div>
    </div>
    <!-- swiper,  swiper-wrapper, swiper-slide 이름 바꾸지말기  무조건 3개는 있어야함-->

    <!-- Initialize Swiper -->
    <script>
      const swiper = new Swiper(".visualSwiper", {
        slidesPerView: 3, // 몇개 보이게 할때
        spaceBetween: 10, //gap값으로 생각하면 됨
        effect: "fade", //fade 효솨

        navigation: {
          nextEl: ".swiper-button-next",
          prevEl: ".swiper-button-prev",
        },
        //오토플레이
        autoplay: {
          delay: 2500,
          disableOnInteraction: false,
        },

        //페이징
        pagination: {
          el: ".swiper-pagination",
          //dynamicBullets: true, //dynamic 효과
          clickable: true, //클릭했을때
        },
      });
      //.visualSwiper 여려개 사용할때 이름을 바꿔서 사용
    </script>
  </body>
</html>
