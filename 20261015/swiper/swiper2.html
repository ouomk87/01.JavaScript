<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>swiper2</title>
    <!-- Link Swiper's CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"
    />
    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>

    <link rel="stylesheet" href="css/swipwe2.css" />
    <script src="js/swiper2.js" defer></script>
    <!--하단js 위에 올릴때 꼭 defer 쓰기-->
  </head>
  <body>
    <!-- swiper -visual-->
    <div class="visual">
      <div class="swiper visualswiper">
        <div class="swiper-wrapper">
          <div class="swiper-slide">
            <img src="images/sw_01.png" alt="img1" />
          </div>
          <div class="swiper-slide">
            <img src="images/sw_02.png" alt="img2" />
          </div>
          <div class="swiper-slide">
            <img src="images/sw_03.png" alt="img3" />
          </div>
        </div>
        <div class="swiper-button-next"></div>
        <div class="swiper-button-prev"></div>
        <div class="swiper-pagination"></div>
      </div>
    </div>
    <!-- 상품리스트 -->
    <div class="product-list inner">
      <div class="swiper proSwiper">
        <div class="swiper-wrapper">
          <div class="swiper-slide">
            <img src="images/about-03-1.png" alt="상품리스트" />
            <div class="item-txt">
              <p>상품설명:1</p>
              <p>상품가격:2,000원</p>
            </div>
          </div>
          <div class="swiper-slide">
            <img src="images/about-03-1.png" alt="상품리스트" />
            <div class="item-txt">
              <p>상품설명:2</p>
              <p>상품가격:2,000원</p>
            </div>
          </div>
          <div class="swiper-slide">
            <img src="images/about-03-1.png" alt="상품리스트" />
            <div class="item-txt">
              <p>상품설명:3</p>
              <p>상품가격:2,000원</p>
            </div>
          </div>
          <div class="swiper-slide">
            <img src="images/about-03-1.png" alt="상품리스트" />
            <div class="item-txt">
              <p>상품설명:4</p>
              <p>상품가격:2,000원</p>
            </div>
          </div>
          <div class="swiper-slide">
            <img src="images/about-03-1.png" alt="상품리스트" />
            <div class="item-txt">
              <p>상품설명:5</p>
              <p>상품가격:2,000원</p>
            </div>
          </div>
          <div class="swiper-slide">
            <img src="images/about-03-1.png" alt="상품리스트" />
            <div class="item-txt">
              <p>상품설명:6</p>
              <p>상품가격:2,000원</p>
            </div>
          </div>
          <div class="swiper-slide">
            <img src="images/about-03-1.png" alt="상품리스트" />
            <div class="item-txt">
              <p>상품설명:1</p>
              <p>상품가격:2,000원</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
