<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <input type="text" id="nameInput" placeholder="이름 입력" />
    <button id="showBtn">확인</button>
    <p id="result">
      <!-- js출력 -->
    </p>
    <script>
      const nameInput = document.querySelector("#nameInput");
      const showBtn = document.querySelector("#showBtn");
      const result = document.querySelector("#result");

      //사용자가 입력한 이름을 받아오는 함수
      function showName(name) {
        console.log(name);

        result.textContent = `안녕하세요~ , ${name}님 반갑습니다.`;
      }
      showBtn.addEventListener("click", () => {
        //userName 변수에 입력창에 입력값 (value) -> input 안에 넣는 값
        let userName = nameInput.value;
        //console.log(userName);
        showName(userName);

        //input 초기화 : 이름을 쓰고 확인을 누르면 초기화가 되면 검색한 이름이 없어짐
        nameInput.value = "";
      });
    </script>
  </body>
</html>
