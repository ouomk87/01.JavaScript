<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>변수 1</title>
</head>
<body>
    
    
    <script>
        //변수 공부
        //변수 : 데이터를 담는 상자
        //변수 선언과 할당
        let name = "이미경"
        console.log(name);
        // name 변수에 재할당
        name = "홍길동"
        console.log(name);
        
        //let 재할당 할수 있음 const 재할당 못함
        //const let 같은 이름을 쓸수 없다
        const age = 30
        //console.log(age);
        
        //age = 30
        console.log(age);

        let userName = prompt("이름을 입력하세요" , "ㅇㅇㅇ")
        console.log(userName);
        
        document.write(`<h1>이름:${userName}</h1> 
        <p>나이: ${age} </p>`)
        
        
    </script>
    
    
</body>
</html>
