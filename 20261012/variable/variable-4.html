<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>변수 4</title>
  </head>
  <body>
    <script>
      let now = new Date();
      console.log(now);

      
      let display = now.toLocaleDateString();
      console.log(display);
      document.write(`<p>오늘 날짜는 ${display} 입니다. </p>`);
      let displaytime = now.toLocaleTimeString();
      document.write(`<p>현재 시간은  ${displaytime} 입니다.</p>`);
      let display2 = now.toLocaleString();
      document.write(`<p>현재 시간은  ${display2} 입니다. </p>`);
    </script>
  </body>
</html>
