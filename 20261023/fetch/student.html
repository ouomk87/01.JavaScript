<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background-color: #f5f5f5;
      }
      h1 {
        text-align: center;
        margin-top: 50px;
      }
      .container {
        width: 90%;
        max-width: 1200px;
        margin: 100px;
        background-color: #fff;
        padding: 20px;
      }
      .student-list {
        display: grid;
        gap: 20px;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      }
      .student-list img {
        width: 100%;
        display: block;
      }
      .card-content {
        padding: 15px;
      }
      /* 모달창 */
      .modal {
        position: fixed;
        width: 100%;
        height: 100vh;
        top: 0;
        left: 0;
        background-color: rgba(0, 0, 0, 0.7);
        /* display: flex; */
        display: none;
        justify-content: center;
        align-items: center;
      }
      .modal.active {
        display: flex;
      }
      .modal-content {
        width: 500px;
        background-color: #fff;
        padding: 30px;
        border-radius: 10px;
        position: relative;
      }
      .close {
        position: absolute;
        right: 20px;
        top: 15px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>학생 정보 관리</h1>
    <div class="container">
      <div id="studentList" class="student-list">
        <!--js출력-->
      </div>
    </div>
    <!-- 모달창 -->
    <div class="modal" id="modal">
      <div class="modal-content">
        <div class="close">&times;</div>
        <!-- 학생 상세내용 -->
        <div id="detail">
          <!-- js출력 -->
        </div>
      </div>
    </div>
    <script>
      const studentList = document.querySelector("#studentList");
      const studentDetail = document.querySelector("#detail");
      const modal = document.querySelector("#modal");
      const closeBtn = document.querySelector(".close");
      fetch("date/student.jon")
        .then((res) => {
          //console.log(res);
          return res.json();
        })
        .then((date) => {
          console.log(date);
          studentList.innerHTML = date
            .map((student) => {
              console.log(student);

              return `
          <div class="card">
          <img src="${student.image}" alt="${student.name}" />
          <div class="card-content">
            <h3>이름:${student.name}</h3>
            <p>${student.major}</p>
          </div>
        </div>
`;
            })
            .join("");

          // 카드 클릭시 모달창(학생 상세 내용)
          const cards = document.querySelectorAll(".card");
          //   console.log(cards);
          cards.forEach((card, index) => {
            // console.log(card);
            card.addEventListener("click", () => {
              // 클릭한 카드와 같은 순서의 학생데이터 가져오기
              const student = date[index];
              //   console.log(student);

              studentDetail.innerHTML = `
          <img src="${student.image}" alt="" />
          <div class="card-content">
            <h2>${student.name}</h2>
            <p><strong>학생번호 : ${student.id}</strong></p>
            <p><strong>전공 : ${student.major}</strong></p>
            <p><strong>이메일 : ${student.email}</strong></p>
            <p><strong>전화번호 : ${student.phone}</strong></p>
          </div>

          `;
              modal.classList.add("active");
            });
          });
        })
        .catch((error) => {
          console.log(error);
        });
      //모달닫기버튼 클릭시
      closeBtn.addEventListener("click", () => {
        modal.classList.remove("active");
      });
      //모달(어두운 배경) 클릭시 닫기
      modal.addEventListener("click", (e) => {
        if (e.target === modal) modal.classList.remove("active");
      });
    </script>
  </body>
</html>
