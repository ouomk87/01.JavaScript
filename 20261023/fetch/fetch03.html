<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      #result {
        display: flex;
        gap: 20px;
        background-color: #fcebff;
        max-width: 1000px;
        flex-wrap: wrap;
      }
      .card {
        background-color: rgb(255, 205, 247);
        padding: 20px;
        flex: 1;
      }
    </style>
  </head>
  <body>
    <h1>사용자 데이터 가져오기</h1>
    <button id="loadBtn">데이터 가져오기</button>
    <div id="result">
      <!--js출력-->
      <div class="card">
        <h2>이름</h2>
        <p><strong>아이디:</strong></p>
        <p><strong>사용자명:</strong></p>
        <p><strong>이메일:</strong></p>
        <p><strong>전화번호:</strong></p>
        <p><strong>웹사이트:</strong></p>
        <p>
          <strong>주소:</strong>
          도시 , 도로명 , 호실
        </p>
        <p><strong>우편번호:</strong></p>
        <p><strong>회사:</strong></p>
      </div>
    </div>
    <script>
      const loadBtn = document.querySelector("#loadBtn");
      const result = document.querySelector("#result");
      loadBtn.addEventListener("click", () => {
        console.log("click");
        fetch("https://jsonplaceholder.typicode.com/users")
          .then((res) => {
            // console.log(res);
            return res.json();
          })
          .then((date) => {
            //console.log(date);
            result.innerHTML = date
              .map((user) => {
                // console.log(user);
                return `<div class="card">
        <h2>${user.name}</h2>
        <p><strong>아이디:${user.id}</strong></p>
        <p><strong>사용자명:${user.username}</strong></p>
        <p><strong>이메일:${user.email}</strong></p>
        <p><strong>전화번호:${user.phone}</strong></p>
        <p><strong>웹사이트:${user.website}</strong></p>
        <p><strong>주소: </strong>
        ${user.address.city} , ${user.address.street} , ${user.address.suite}
        </p>
        <p><strong>우편번호:${user.address.zipcode}</strong></p>
        <p><strong>회사: ${user.company.name}</strong></p>

      </div>`;
              })
              .join(""); // 기본문법 result.innerHTML = date.map().join("")
          })
          .catch((error) => {
            console.log(error);
          });
      });
    </script>
  </body>
</html>
