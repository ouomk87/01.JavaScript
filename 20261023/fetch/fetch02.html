<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="result">
      <!-- js출력 -->
      <div class="card">
        <h3>상품명</h3>
        <p>가격 :</p>
      </div>
    </div>
    <script>
      fetch("product_json")
        .then((res) => {
          // console.log(res); //res만 써도 됨
          return res.json();
        })
        .then((date) => {
          // console.log(date);
          //const htmlEl = date.map().join("")
          // result.innerHTML = htmlEl
          const result = document.querySelector("#result");
          result.innerHTML = date
            .map((item) => {
              // console.log(item);
              return `<div class="card">
          <h3>상품명 : ${item.name}</h3><p>가격 :${item.price}</p></div>
      </div>`;
            })
            .join(""); //htmlEl;자리에 date.map().join("") 넣어서 써도 됨
        })
        .catch((error) => {
          console.log(error);
        });
    </script>
  </body>
</html>
