<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        //계산하거나 비교할 때 쓰는 기호

        //산술연산자
        let a = 10;
        let b = 3;
        console.log(a+b);//더하기
        console.log(a-b);//빼기
        console.log(a*b);//곱하기
        console.log(a/b);//나누기
        console.log(a%b);//나머지
        
        // 비교연산자 (맞는지 확인)
        console.log(5 > 3); //true
        console.log(5 < 3); //false
        console.log(5 == 3); //false 같다의 표시는 ==
        console.log(5 === 5); //false 완전히 같은지 확인
        console.log(5 != 3); //false 부정
        
         //논이 연산자
        let age= 20
        console.log(age > 18 && age < 30); //그리고 && 둘다 같아야지 true
        console.log(age > 18 || ages > 30); // || 하나만 맞아도 true
        
        // ! 반대로 바꾸기
        let isLogin = true
        console.log(!isLogin); // !을 붙이면 true가 false로 바꿈
        
        
        //증가/감소 연산자
        let count = 5
        count++ // ++ 증가
        console.log(count);
        count-- // -- 감소
        console.log(count);
        
        
    </script>

</body>
</html>
