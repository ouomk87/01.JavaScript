<html lang="ko">

    <meta charset="UTF-8" />

  <body>
    <script>
      //       switch(조건){
      //           case 값1 : 명령 1 ;

      //           case 값2 : 명령 2 ;
      //           break
      //           case 값3 : 명령 3 ;
      //           break
      // // 참이면 값1이 실행, 거짓이면 명령 1 이 실행
      // default
      //       }
      let score = prompt("점수를 입력하세요");
      //   let score = prompt("점수를 입력하세요" , "90");
      console.log(score);

      let grade; // 변수 선언만 한 상태
      switch (true) {
        case score >= 90:
          grade = "A 학점";
          break;

        case score >= 80:
          grade = "B 학점";
          break;
        case score >= 70:
          grade = "C 학점";
          break;
        case score >= 60:
          grade = "D 학점";
          break;
        default:
          grade = "F학점";
      }
      document.write(`당신의 학점은 : ${grade}`);
    </script>
  </body>
