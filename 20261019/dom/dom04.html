<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      #cover2 {
        /* width: 100px;*/
        border-radius: 50%;
        border: 3px solid red;
      }
    </style>
  </head>
  <body>
    <img src="images/easys-1.jpg" alt="이미지" id="cover" />
    <script>
      const cover = document.getElementById("cover");
      //console.log(cover);
      //console.log(cover.src);
      //console.log(cover.alt);

      cover.addEventListener("mouseover", (event) => {
        console.log(event.target); //target이라는 속성으로 이미지를 잡고 있다
        console.log(event.target.src);

        cover.src = "images/easys-2.jpg"; //이미지 바꾸기
        console.log(cover);
        cover.id = "cover2"; //아이디 바꾸기
      });
      cover.addEventListener("mouseout", () => {
        cover.src = "images/easys-1.jpg"; //이미지 바꾸기
        //console.log(cover);
        cover.id = "cover"; //아이디 바꾸기
      });
    </script>
  </body>
</html>
