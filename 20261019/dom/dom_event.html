<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .imgbox img {
        width: 100px;
      }
    </style>
  </head>
  <body>
    <ul id="menu">
      <li>회사소개</li>
      <li>제품소개</li>
      <li>고객센터</li>
    </ul>
    <div id="result">
      <!--내가 클릭한 글자 js 출력-->
    </div>
    <!-- 클릭한 이미지 크게 보이기 -->

    <!-- 큰이미지 -->
    <img src="images/cup-1.png" alt="redcup" id="big" />
    <!-- 작은이미지 -->
    <div class="imgbox">
      <img src="images/cup-1.png" alt="red" />
      <img src="images/cup-2.png" alt="blue" />
    </div>

    <script>
      const menuE = document.getElementById("menu");
      const result = document.getElementById("result");
      menuE.addEventListener("click", (e) => {
        console.log(e.target);
        result.innerHTML = `<p>내가 클릭한 메뉴 : <span>${e.target.innerText}</span></p>`;
        //result.innerHTML += `<p>내가 클릭한 메뉴 : <span>${e.target.innerText}</span></p>`;
      });
      //+= +를 붙이면 쌓여서 나옴

      //작은 이미지 클릭시 큰 이미지 변경
      const imgbox = document.querySelector(".imgbox");
      const img = document.querySelectorAll(".imgbox img");
      const big = document.querySelector("#big");
      imgbox.addEventListener("click", (e) => {
        console.log(e.target.src);
        //큰이미지 변경
        // big.src = e.target.src;
      });
    </script>
  </body>
</html>
