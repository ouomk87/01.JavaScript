<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .box {
        width: 200px;
        height: 200px;
        background-color: aquamarine;
        margin-bottom: 20px;
      }
      .box1.active {
        background-color: rgb(225, 255, 208);
      }
      .box2.active {
        background-color: rgb(255, 221, 158);
      }
      .box3.active {
        background-color: rgb(255, 167, 220);
      }
      .box4.active {
        background-color: rgb(172, 178, 236);
      }
    </style>
  </head>
  <body>
    <h1>keyup 이벤트</h1>
    <div class="box box1">box1</div>
    <div class="box box2">box2</div>
    <div class="box box3">box3</div>
    <div class="box box4">box4</div>
    <script>
      document.addEventListener("keyup", (e) => {
        console.log(e);
        let keyB = e.key.toLowerCase(); //누르는 키를 소문자로 보여줄께
        //let 재할당하기 때문에 let을 씀 const 재할당하지 못해서 오류남
        console.log(keyB);
        let box = null; // 박스를 아무것도 없는 상태로 만든다음에  class을 줘서 값을 담을 예정
        if (keyB === "enter") {
          box = document.querySelector(".box1");
        } else if (keyB === "shift") {
          box = document.querySelector(".box2");
        } else if (keyB === "s") {
          box = document.querySelector(".box3");
        } else if (keyB === "f") {
          box = document.querySelector(".box4");
        }

        console.log(box);

        if (box != null) {
          box.classList.add("active");
        }
      });
    </script>
  </body>
</html>
