<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>객체</title>
  </head>
  <body>
    <!-- 객체 : 여러가지 정보를 하나로 묶어 놓은것 -->
    <!-- 내장 객체 : 자바스크립트가 미리 만들어 놓은 객체 -->
    <!-- Date, Array(배열), String(글자 수), Math(정수로 해라)  -->
    <script>
      // 1.String 앞자리 대문자로 쓴다.
      const str = "Hello World";
      console.log(str);
      console.log(str.length); //length속성 : 문자의 길이 계산하는 속성 - 빈공간까지 계산함
      console.log(str.toUpperCase()); //대문자로 변경하는 메서드 ()<-있는거는 메서드(~하라고 시키는것)라고 함
      console.log(str.includes("World")); //includes 해당 하는 내용이 있는지 없는지 확인할때 -> 있으면 true로 나옴
      
      // 2.Array(배열)
      const arr = [1, 2, 3, 4];
      console.log(arr);
      console.log(arr.length);
      console.log(arr.push(5)); //push해라가 되기때문에()들어감 -> 위에 배열안에 5를 추가시킴
      console.log(arr);
      console.log(arr.join("/")); // join메서드 : 연결하라

      // 3.Date
      const today = new Date();
      console.log(today);
      console.log(today.getMonth() + 1); //현재 날짜 (월 0부터 출렬하기 때문에 +1을 더해줘야함) : getMonth 날짜를 가지고 와라~가 되기때문에 ()붙임
      console.log(today.toDateString());
      console.log(today.toLocaleDateString());
      console.log(today.getFullYear());
      
      // 4.Math 수학객체
      console.log(Math.PI); //Math. -> .은 그안에 pi값 
      console.log(Math.max(10,23,100,50)); //제일 큰 수를 출력한다.
      console.log(Math.min(10,23,100,50)); //제일 작은 수를 출력한다.
      console.log(Math.random()); //0~1 : 0~1 사이 난수를 랜덤으로 출력한다. (1은 포함 하지 않는다.)
      
      
      
      
      
    </script>
  </body>
</html>
