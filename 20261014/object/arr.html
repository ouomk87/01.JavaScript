<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Array 객체</title>
  </head>
  <body>
    <script>
      // Array 여러 데이터를 순서대로 관리
      const arr = [1, 2, 3, 4];
      console.log(arr);

      //1.length 속성
      console.log(arr.length);

      //2.push() : 배열 끝 요소를 추가하는 메서드
      arr.push(8);
      console.log(arr);

      //3.pop() : 배열 끝 요소를 제거하는 메서드
      arr.pop();
      console.log(arr);
      // 한번더 적용하면 또 마지막 요소가 제거됨
      arr.pop();
      console.log(arr);

      //4.shift() : 배열 첫 요소 제거
      arr.shift();
      console.log(arr);

      //5.unshift() : 배열 앞에 요소를 추가하는 메서드
      arr.unshift(7);
      console.log(arr);

      //6.indexOff : 요소 위치 반환 (index번호)
      console.log(arr.indexOf(3)); //배열한 요소에 위치를 반환함 2번째 숫자는 0부터 시작해서 1이 출력됨
      console.log(arr.indexOf(7));

      //7.slice() : 배열 일부 반환
      //slice(시작인덱스(포함), 끝인덱스(미포함))
      console.log(arr.slice(1, 4)); // 결과물 [7,2,3,4] => [2,3,4]

      //8.splice() : 배열요소 추가 / 삭제
      //splice(시작인덱스(어디서부터), 삭제갯수, 추가할값1, 추가할값2, ...)
      console.log(arr);
      arr.splice(1, 2, 44, 50, 100, 200);
      console.log(arr);

      //9. join() : 배열을 문자열로 변환
      console.log(arr.join("*****"));

      //10.forEach() : 각요소에 대해 함수 실행 -->사용많이 함
      arr.forEach((a) => {
        console.log(a);
        document.write(`<p>${a}</p>`);
      });
    </script>
  </body>
</html>
