<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      ul {
        display: flex;
        gap: 30px;
      }
      li {
        width: 200px;
        background-color: bisque;
        padding: 20px;
      }
      li img {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <ul id="prodouctList">
      <!-- js출력 -->
    </ul>
    <script>
      const proList = document.querySelector("#prodouctList");
      //console.log(proList);
      //더미 데이터
      const product = [
        {
          name: "티셔츠",
          price: 15000,
          desc: "이쁜 티셔츠",
          img: "images/tshirt.jpg",
        },
        {
          name: "청바지",
          price: 25000,
          desc: "이쁜 청바지",
          img: "images/jeans.jpg",
        },
        {
          name: "운동화",
          price: 45000,
          desc: "이쁜 운동화",
          img: "images/shoes.jpg",
        },
      ];
      //console.log(product);
      //객체 안에 {} 안에 담는다 css안에 넣는 방식과 같은 예) color:red

      //product.forEach(function(){})
      product.forEach((item, index) => {
        // console.log(item, index);
        // console.log(item.name);
        // console.log(item.price);
        // console.log(item.desc);
        proList.innerHTML += `
        <li>
            <img src="${item.img}" alt="${item.name}">
            <h3>상품 이름 : ${item.name}</h3>
            <p>상품 설명 : ${item.price.toLocaleString()}원</p>
            <p>가격 상품 : ${item.desc}</p>    
        </li>
       
       `;
      });
      //처음엔 리스트 하나만 나오는데 3개가 다 나오려면 +를 추가해서 +=
      //가격에 . 넣을려면 .toLocaleString() 넣기
    </script>
  </body>
</html>
