<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form 태그</title>
</head>
<body>
    <form>
        <!--글자를 입력-->
        <input type="text" placeholder="아이디">
        <!--비밀번호 입력-->
        <input type="password" placeholder="비밀번호" required>
        <!--이메일-->
        <!--name:데이터를 전송할때 사용하는 이름-->
        <input type="email" placeholder="이메일" name="email">
        <!--전화번호 입력-->
        <input type="tel" placeholder="010-0000-0000">
        <!--숫자 입력-->
        <input type="number" min="1" max="10">
        <!--인터넷 주소 입력-->
        <input type="url" placeholder="https://example.com">
        <!--검색 입력-->
        <input type="search" placeholder="search">
        <!--네모:여러개 선택가능-->
        <input type="checkbox" checked>
        <input type="checkbox">
        <input type="checkbox">
        <!--동그라미:하나만 선택가능-->
        <input type="radio" name="gender">
        <input type="radio" name="gender">
        <input type="radio" name="gender">
        <!--파일선택-->
        <input type="file">
        <!--그냥버튼(눌러도 아무일도 안일어남)-->
        <input type="button" value="로그인">
        <button type="submit">제출</button>
        <!--사진모양의 버트-->
        <input type="image" src="gg_img.png">
        <!--화면에 안 보이지만 몰래 값을 저장하는 칸-->
        <input type="hidden">
        <!--날짜선택-->
        <input type="date">
        <!--날짜랑 시간을 같이 선택-->
        <input type="datetime-local">
        <!--연도와 월을 선택-->
        <input type="month">
        <!--몇번째 주 선택-->
        <input type="week">
        <!--시간선택-->
        <input type="time">
        <!--막대를 움직여서 값 선택-->
        <input type="range">
        <!--색선택-->
        <input type="color">
        <!--글쓰기-->
        <textarea></textarea>
    </form>
    
</body>
</html>
