<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주문관리</title>
    <link rel="stylesheet" href="css/table.css">
</head>
<body>
    <!--  -->
    <!--관리자페이지-->
    <div class="amin">
        <!-- 제목 -->
         <h2>주문관리</h2>
         <!-- 주문 목록 테이블 -->
          <table>
            <!-- 표의 제목 영역 -->
             <thead>
                <tr>
                    <th>주문번호</th>
                    <th>고객명</th>
                    <th>상품명</th>
                    <th>수량</th>
                    <th>금액</th>
                    <th>주문상태</th>
                </tr>
             </thead>
             <!-- 실제 데이터 영역 -->
              <tbody>
                <!-- 첫번째 주문 -->
                <tr>
                    <td>1001</td>
                    <td>김민지</td>
                    <td>무선 키보드</td>
                    <td>1</td>
                    <td>59,000원</td>
                    <td class="complete">배송완료</td>
                </tr>
                <!-- 두번째 주문 -->
                <tr>
                    <td>1002</td>
                    <td>홍길동</td>
                    <td>무선 마우스</td>
                    <td>2</td>
                    <td>49,000원</td>
                    <td class="delivery">배송중</td>
                </tr>
                <!-- 셋번째 주문 -->
                <tr>
                    <td>1003</td>
                    <td>이수진</td>
                    <td>노트북 받침대</td>
                    <td>1</td>
                    <td>39,000원</td>
                    <td class="ready">상품준비중</td>
                </tr>
                 <!-- 네번째 주문 -->
                <tr>
                    <td>1004</td>
                    <td>김민지</td>
                    <td>무선 키보드</td>
                    <td>1</td>
                    <td>59,000원</td>
                    <td class="complete">배송완료</td>
                </tr>
              </tbody>

          </table>

    </div>
</body>
</html>
